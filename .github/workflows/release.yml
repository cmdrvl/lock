name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cargo package version to release (optional; defaults to Cargo.toml version)
        required: false
        type: string
  push:
    branches: ["main"]
    paths: ["Cargo.toml"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # A released version is immutable: if v<version> is tagged at another commit (or released), the
  # release jobs are skipped. A re-run of the same commit still publishes.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this version is already released
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="v$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")"
          publish=true
          released_at=""
          if tag_sha="$(git rev-parse --verify --quiet "refs/tags/${version}^{commit}")"; then
            # A tag at this commit is a re-run of the same release and may publish; anywhere else it is taken.
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              publish=false
              released_at="tag ${version} at ${tag_sha}"
            fi
          elif release_error="$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1 >/dev/null)"; then
            # A release without its tag in the checkout still means the version is published.
            publish=false
            released_at="an existing GitHub release ${version}"
          else
            case "$release_error" in
              *"release not found"*) ;;
              *)
                echo "::error::release guard: could not check for release ${version}: ${release_error}"
                exit 1
                ;;
            esac
          fi
          if [ "$publish" = false ]; then
            echo "::notice::version ${version#v} is already released (${released_at}); bump the version to release again. Release jobs are skipped."
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  preflight:
    name: Release preflight checks
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          declared_version="$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          requested_version="${{ github.event.inputs.version || '' }}"
          if [[ -z "${declared_version}" ]]; then
            echo "Unable to read package version from Cargo.toml"
            exit 1
          fi
          if [[ -n "${requested_version}" && "${declared_version}" != "${requested_version}" ]]; then
            echo "Version mismatch: Cargo.toml=${declared_version}, workflow input=${requested_version}"
            exit 1
          fi
          release_version="${requested_version:-${declared_version}}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${release_version}" >> "${GITHUB_OUTPUT}"
          echo "Using release version ${release_version}"

      - name: Verify Cargo.lock is synchronized
        run: cargo check --locked --all-targets

      - name: Enforce formatting
        run: cargo fmt --check

      - name: Enforce clippy warnings as errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -- --test-threads=1

      - name: Smoke doctor surface
        run: |
          cargo run --locked -- --robot-triage
          cargo run --locked -- capabilities --json
          cargo run --locked -- robot-docs guide
          cargo run --locked -- doctor health
          cargo run --locked -- doctor capabilities --json
          cargo run --locked -- doctor robot-docs
          cargo run --locked -- doctor --robot-triage

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Strip binary (native)
        if: "!matrix.cross && runner.os != 'Windows'"
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/lock"
          if command -v strip >/dev/null; then
            case "${{ runner.os }}" in
              macOS) strip -x "${bin}" ;;
              *)     strip "${bin}" ;;
            esac
          fi

      - name: Install cross-strip toolchain (Linux aarch64)
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Strip binary (cross)
        if: matrix.cross
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/lock

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.release_version }}"
          target="${{ matrix.target }}"
          staging="lock-${version}-${target}"
          mkdir -p "${staging}"
          cp "target/${target}/release/lock" "${staging}/"
          cp README.md LICENSE "${staging}/"
          tar czf "${staging}.tar.gz" "${staging}"
          echo "ARCHIVE=${staging}.tar.gz" >> "${GITHUB_ENV}"

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.release_version }}"
          target="${{ matrix.target }}"
          staging="lock-${version}-${target}"
          mkdir -p "${staging}"
          cp "target/${target}/release/lock.exe" "${staging}/"
          cp README.md LICENSE "${staging}/"
          7z a "${staging}.zip" "${staging}"
          echo "ARCHIVE=${staging}.zip" >> "${GITHUB_ENV}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create release with artifacts
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: archive-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum lock-* > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Sign SHA256SUMS with cosign (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature artifacts/SHA256SUMS.sig \
            --output-certificate artifacts/SHA256SUMS.pem \
            artifacts/SHA256SUMS

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/lock-${{ needs.preflight.outputs.release_version }}.sbom.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Collect provenance bundle artifact
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" "artifacts/lock-${{ needs.preflight.outputs.release_version }}.provenance.intoto.jsonl"

      - name: Create annotated tag if missing
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.release_version }}"
          tag="${{ needs.preflight.outputs.release_tag }}"
          if tag_sha="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
            # Second check: never release a tag that names another commit.
            if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
              echo "::error::${tag} is tagged at ${tag_sha}, not ${GITHUB_SHA}; refusing to release over it. Bump the version."
              exit 1
            fi
            echo "Tag ${tag} already points to this commit. Reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "lock ${tag}"
            git push origin "${tag}"
          fi

      - name: Write release notes preamble
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/release-notes.md <<'EOF'
          This release packages `${{ needs.preflight.outputs.release_tag }}` for all supported targets.

          ## Verification

          ```bash
          sha256sum -c SHA256SUMS
          ```
          EOF

      - name: Create a new GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.release_tag }}"
          gh release create "${tag}" artifacts/* \
            --generate-notes \
            --notes-file artifacts/release-notes.md \
            --verify-tag \
            --title "lock ${tag}"

  homebrew:
    name: Update Homebrew tap
    needs: [preflight, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.release_version }}"
          tag="${{ needs.preflight.outputs.release_tag }}"
          gh release download "${tag}" --repo "${{ github.repository }}" --pattern "SHA256SUMS" --dir .
          cat SHA256SUMS

      - name: Generate Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.release_version }}"
          repo="${{ github.repository }}"
          base_url="https://github.com/${repo}/releases/download/v${version}"

          # Extract checksums for each platform.
          macos_arm_sha=$(grep "aarch64-apple-darwin" SHA256SUMS | awk '{print $1}')
          macos_intel_sha=$(grep "x86_64-apple-darwin" SHA256SUMS | awk '{print $1}')
          linux_sha=$(grep "x86_64-unknown-linux-gnu" SHA256SUMS | awk '{print $1}')
          linux_arm_sha=$(grep "aarch64-unknown-linux-gnu" SHA256SUMS | awk '{print $1}')

          for checksum_name in macos_arm_sha macos_intel_sha linux_sha linux_arm_sha; do
            if [[ -z "${!checksum_name}" ]]; then
              echo "Missing checksum for ${checksum_name} in SHA256SUMS"
              exit 1
            fi
          done

          cat > lock.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          class Lock < Formula
            desc "Create self-hashed dataset lockfiles"
            homepage "https://github.com/${repo}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${base_url}/lock-${version}-aarch64-apple-darwin.tar.gz"
                sha256 "${macos_arm_sha}"
              else
                url "${base_url}/lock-${version}-x86_64-apple-darwin.tar.gz"
                sha256 "${macos_intel_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${base_url}/lock-${version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_arm_sha}"
              else
                url "${base_url}/lock-${version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_sha}"
              end
            end

            def install
              bin.install "lock"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/lock --version")
            end
          end
          FORMULA

          # Strip leading whitespace from heredoc indentation.
          sed -i 's/^          //' lock.rb
          echo "--- Generated formula ---"
          cat lock.rb

      - name: Push formula to Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.release_version }}"
          tap_repo="cmdrvl/homebrew-tap"

          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN secret not configured. Skipping tap update."
            exit 0
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${tap_repo}.git" tap
          mkdir -p tap/Formula
          cp lock.rb tap/Formula/lock.rb

          cd tap
          # Check if formula content changed.
          if git diff --quiet -- Formula/lock.rb 2>/dev/null; then
            echo "Formula unchanged. No-op."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lock.rb
          git commit -m "lock ${version}"
          git push origin HEAD
